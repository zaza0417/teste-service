spring:
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5433/single
    username: ${DB_USER:teste_single}
    password: ${DB_PASSWORD_TESTE:test170415}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update

  servlet:
    encoding:
      charset: UTF-8
      enabled: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m,recordStats

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger
    operationsSorter: method
    tagsSorter: alpha
  packages-to-scan: br.com.singletech.teste.registro

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, caches
  endpoint:
    health:
      show-details: when-authorized
    caches:
      enabled: true
    metrics:
      enabled: true

logging:
  level:
    org.springframework: WARN
    org.hibernate: WARN
    br.com.singletech: INFO